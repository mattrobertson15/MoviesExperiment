[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "movies-api"
version = "1.0.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["movies_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=movies_api --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["movies_api"]
omit = ["tests/*"]
