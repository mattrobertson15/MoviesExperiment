apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movies-api
  namespace: movies
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  # k3s ships with traefik; override per-cluster in overlays if needed
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: movies-api
                port:
                  name: http
